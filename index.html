<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MealPlan">
  <title>MealPlanProgram</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="print.css" media="print">
</head>
<body>
  <header class="app-header no-print">
    <div class="header-left">
      <h1>MealPlanProgram</h1>
      <span id="sync-status" class="status-badge">Loading...</span>
    </div>
    <nav class="desktop-nav">
      <button class="nav-btn active" data-view="plan">Plan</button>
      <button class="nav-btn" data-view="shopping">Shop</button>
      <button class="nav-btn" data-view="library">Meals</button>
    </nav>
    <div class="header-right">
      <button id="refresh-btn" class="btn-secondary" title="Sync with Google Sheet">Sync</button>
      <button id="new-meal-btn" class="btn-primary">+ Meal</button>
    </div>
  </header>

  <main class="app-main">
    <section id="view-plan" class="view-section active no-print">
      <div class="section-toolbar">
        <h2>Plan</h2>
        <button id="clear-plan-btn" class="btn-danger-outline">Clear Week</button>
      </div>
      <div id="weekly-grid" class="weekly-grid"></div>
    </section>

    <section id="view-shopping" class="view-section">
      <div class="section-toolbar no-print">
        <h2>Shop</h2>
        <div class="toolbar-actions">
          <button id="add-other-items-btn" class="btn-primary">Add Other Items</button>
          <button id="reset-shopping-btn" class="btn-secondary">Reset Overrides</button>
          <button id="print-btn" class="btn-primary">Print / Save 8.5x11 PDF</button>
        </div>
      </div>

      <div id="shopping-quadrants" class="quadrants-grid">
        <div class="quadrant" data-category="Produce">
          <div class="quadrant-header">
            <h3>Produce</h3>
          </div>
          <div class="custom-add-wrapper no-print">
            <input type="text" class="custom-item-input" data-category="Produce" placeholder="Add produce item..." autocomplete="off">
            <input type="number" class="custom-qty-input" value="1" min="0.01" step="any">
            <select class="custom-unit-select"></select>
            <button class="btn-add-custom" data-category="Produce">+</button>
            <div class="autocomplete-dropdown"></div>
          </div>
          <ul class="shopping-items-list" id="list-Produce"></ul>
        </div>

        <div class="quadrant" data-category="Grocery">
          <div class="quadrant-header">
            <h3>Grocery</h3>
          </div>
          <div class="custom-add-wrapper no-print">
            <input type="text" class="custom-item-input" data-category="Grocery" placeholder="Add grocery item..." autocomplete="off">
            <input type="number" class="custom-qty-input" value="1" min="0.01" step="any">
            <select class="custom-unit-select"></select>
            <button class="btn-add-custom" data-category="Grocery">+</button>
            <div class="autocomplete-dropdown"></div>
          </div>
          <ul class="shopping-items-list" id="list-Grocery"></ul>
        </div>

        <div class="quadrant" data-category="Frozen/Dairy">
          <div class="quadrant-header">
            <h3>Frozen/Dairy</h3>
          </div>
          <div class="custom-add-wrapper no-print">
            <input type="text" class="custom-item-input" data-category="Frozen/Dairy" placeholder="Add frozen/dairy item..." autocomplete="off">
            <input type="number" class="custom-qty-input" value="1" min="0.01" step="any">
            <select class="custom-unit-select"></select>
            <button class="btn-add-custom" data-category="Frozen/Dairy">+</button>
            <div class="autocomplete-dropdown"></div>
          </div>
          <ul class="shopping-items-list" id="list-Frozen/Dairy"></ul>
        </div>

        <div class="quadrant" data-category="Supplies/Specialty">
          <div class="quadrant-header">
            <h3>Supplies/Specialty</h3>
          </div>
          <div class="custom-add-wrapper no-print">
            <input type="text" class="custom-item-input" data-category="Supplies/Specialty" placeholder="Add supply/specialty item..." autocomplete="off">
            <input type="number" class="custom-qty-input" value="1" min="0.01" step="any">
            <select class="custom-unit-select"></select>
            <button class="btn-add-custom" data-category="Supplies/Specialty">+</button>
            <div class="autocomplete-dropdown"></div>
          </div>
          <ul class="shopping-items-list" id="list-Supplies/Specialty"></ul>
          <div class="staples-pool-container no-print">
            <div id="supplies-staples-pool" class="staples-pool"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="view-library" class="view-section no-print">
      <div class="section-toolbar">
        <h2>Meals</h2>
      </div>
      <div class="search-bar">
        <input type="text" id="library-search" placeholder="Search meals or ingredients...">
      </div>
      <div id="meal-library-grid" class="library-grid"></div>
    </section>
  </main>

  <nav class="mobile-nav no-print">
    <button class="nav-btn active" data-view="plan">Plan</button>
    <button class="nav-btn" data-view="shopping">Shop</button>
    <button class="nav-btn" data-view="library">Meals</button>
  </nav>

  <div id="meal-editor-modal" class="modal hidden no-print">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="editor-modal-title">Add New Meal</h3>
        <button class="close-modal" data-close="meal-editor-modal">&times;</button>
      </div>
      <form id="meal-form">
        <input type="hidden" id="edit-meal-id">
        <div class="form-row">
          <div class="form-group flex-2">
            <label for="meal-title-input">Meal Title</label>
            <input type="text" id="meal-title-input" required placeholder="e.g., Fried Rice">
          </div>
          <div class="form-group flex-1">
            <label for="meal-effort-select">Effort</label>
            <select id="meal-effort-select">
              <option value="Quick">Quick</option>
              <option value="Normal" selected>Normal</option>
              <option value="Complex">Complex</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Ingredients</label>
          <div id="ingredient-rows-container"></div>
          <button type="button" id="add-ingredient-row-btn" class="btn-secondary">+ Add Ingredient</button>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary close-modal" data-close="meal-editor-modal">Cancel</button>
          <button type="submit" class="btn-primary">Save Meal</button>
        </div>
      </form>
    </div>
  </div>

  <div id="slot-picker-modal" class="modal hidden no-print">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="slot-picker-title">Assign Meal</h3>
        <button class="close-modal" data-close="slot-picker-modal">&times;</button>
      </div>
      <input type="text" id="slot-meal-search" placeholder="Filter meals..." class="modal-search">
      <div id="slot-meal-options" class="slot-options-list"></div>
    </div>
  </div>

  <div id="other-items-modal" class="modal hidden no-print">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Add Other Items</h3>
        <button class="close-modal" data-close="other-items-modal">&times;</button>
      </div>

      <div class="other-item-entry-bar">
        <div class="other-name-wrapper">
          <input type="text" id="other-item-name" placeholder="Type item name..." autocomplete="off">
          <div id="other-item-dropdown" class="autocomplete-dropdown"></div>
        </div>
        <input type="number" id="other-item-qty" value="1" min="0.01" step="any">
        <select id="other-item-unit" class="custom-unit-select"></select>
        <button type="button" id="queue-other-item-btn" class="btn-primary">Add</button>
      </div>

      <div id="new-item-category-prompt" class="category-prompt-box hidden">
        <p id="category-prompt-text">New item! Select a category to save it:</p>
        <div class="category-choice-grid">
          <button type="button" class="btn-category-choice" data-cat="Produce">Produce</button>
          <button type="button" class="btn-category-choice" data-cat="Grocery">Grocery</button>
          <button type="button" class="btn-category-choice" data-cat="Frozen/Dairy">Dairy/Frozen</button>
          <button type="button" class="btn-category-choice" data-cat="Supplies/Specialty">Supplies/Specialty</button>
        </div>
      </div>

      <div class="queued-items-section">
        <label class="queued-label">Items to Add</label>
        <ul id="queued-other-items-list" class="queued-items-list"></ul>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary close-modal" data-close="other-items-modal">Cancel</button>
        <button type="button" id="confirm-other-items-btn" class="btn-primary">Add Now</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
